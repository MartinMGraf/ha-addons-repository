name: Paperless-ngx
version: 1.0.0
slug: paperless-ngx
description: "Paperless-ngx document management with the existing Redis add-on."
url: https://github.com/paperless-ngx/paperless-ngx
arch:
  - aarch64
init: false
startup: services
boot: auto
ports:
