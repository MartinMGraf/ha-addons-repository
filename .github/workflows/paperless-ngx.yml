name: Paperless-ngx Add-on

on:
  push:
    branches:
      - main
    paths:
      - paperless-ngx/**
      - .github/workflows/paperless-ngx.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version
        id: addon
        shell: bash
        run: echo "version=$(sed -n 's/^version: *//p' paperless-ngx/config.yaml)" >> "$GITHUB_OUTPUT"

      - name: Build and push Paperless-ngx image
        uses: docker/build-push-action@v6
        with:
          context: ./paperless-ngx
          file: ./paperless-ngx/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/martinmgraf/ha-addon-paperless-ngx:latest
            ghcr.io/martinmgraf/ha-addon-paperless-ngx:${{ steps.addon.outputs.version }}
            ghcr.io/martinmgraf/ha-addon-paperless-ngx:${{ github.sha }}
