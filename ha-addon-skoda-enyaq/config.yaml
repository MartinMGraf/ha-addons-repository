name: Škoda Enyaq
version: 2026.09.187
slug: ha-addon-skoda-enyaq
description: "Reads the current battery's state of charge (SoC) from the vehicle."
arch:
- aarch64
init: false
watchdog: http://[HOST]:[PORT:5000]/livez
homeassistant_api: true
hassio_api: true
image: ghcr.io/martinmgraf/ha-addon-skoda-enyaq
# Configuration options
config:
  # Skoda API Configuration
  skoda_api_key:
    description: "API key for Skoda Connect API authentication"
    example: "your-skoda-api-key"
  skoda_vehicle_vin:
    description: "Vehicle Identification Number (VIN) of the vehicle to monitor"
    example: "TMBJH9NY5TF024232"
  skoda_api_base_url:
    description: "Base URL for the Skoda API"
    example: "https://public.api.connect.skoda-auto.cz/api/v1"
  skoda_polling_interval_minutes:
    description: "Polling interval in minutes (minimum 5 due to API rate limiting)"
    example: 5
    type: integer

  # MQTT Configuration
  mqtt_host:
    description: "MQTT broker hostname or IP address"
    example: "localhost"
  mqtt_port:
    description: "MQTT broker port (default: 1883 for unsecured, 8883 for secured)"
    example: 1883
    type: integer
  mqtt_username:
    description: "Username for MQTT broker authentication (optional)"
    example: "mqtt_user"
  mqtt_password:
    description: "Password for MQTT broker authentication (optional)"
    example: "mqtt_password"
  mqtt_topic_prefix:
    description: "MQTT topic prefix for Home Assistant discovery and state topics"
    example: "homeassistant"

# Environment variables configuration
options:
  skoda_api_key: ""
  skoda_vehicle_vin: ""
  skoda_api_base_url: "https://public.api.connect.skoda-auto.cz/api/v1"
  skoda_polling_interval_minutes: 5
  mqtt_host: "localhost"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic_prefix: "homeassistant"

schema:
  skoda_api_key: str
  skoda_vehicle_vin: str
  skoda_api_base_url: str
  skoda_polling_interval_minutes: int(5,)
  mqtt_host: str
  mqtt_port: int(1,65535)
  mqtt_username: str?
  mqtt_password: str?
  mqtt_topic_prefix: str
